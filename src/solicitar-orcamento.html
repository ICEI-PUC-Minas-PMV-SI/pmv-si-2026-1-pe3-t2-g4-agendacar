<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgendaCar - Solicitar Orçamento</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0' y='4' width='5' height='5' rx='2.5' fill='%23f47920'/%3E%3Crect x='0' y='13' width='5' height='5' rx='2.5' fill='%2312368a'/%3E%3Cg transform='skewX(-10) translate(6, 1)'%3E%3Crect x='0' y='0' width='25' height='30' rx='4' fill='%2312368a'/%3E%3Crect x='4' y='3' width='17' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='4' y='12' width='17' height='5' rx='2' fill='%23ffffff'/%3E%3Crect x='4' y='21' width='17' height='5' rx='2' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />

    <style>
        .content h1 { font-size: 24px; margin-bottom: 48px; }
        .content-body { display: flex; flex-wrap: wrap; column-gap: 16px; width: 100%; max-width: 1200px; }
        .content-body > * { flex: 1; }

        .card-prestador-container { padding: 16px; }
        .card-prestador { border: 1px solid #d9d9d9; border-radius: 8px; padding: 24px; position: relative; background: white; }
        .card-prestador h3 { font-size: 24px; color: var(--text-blue);}
        .card-prestador span { font-size: 16px; font-weight: 600; color: #757575; margin-bottom: 8px; display: block; }
        .card-prestador p { font-size: 16px; font-weight: 400; color: #1e1e1e; margin-bottom: 24px; }
        .card-prestador img { position: absolute; top: -30px; right: -10px; width: 100px; height: 100px; border-radius: 60px; object-fit: cover;}

        .form-orcamento { min-width: 300px; display: flex; flex-direction: column; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e5e7eb;}
        .form-input { margin-bottom: 16px; }
        .label-orcamento { display: block; font-size: 16px; font-weight: 700; color: #1e1e1e; margin-bottom: 12px; }
        .texto-orcamento { width: 100%; border: 1px solid #d9d9d9; border-radius: 8px; padding: 12px; background: #fafafa; font-family: "Roboto", sans-serif; font-size: medium; box-sizing: border-box; resize: vertical;}

        .botao-solicitar button { margin-top: 16px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--primary-orange), #ff9040); width: 100%; padding: 14px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s;}
        .botao-solicitar button:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(244, 121, 32, 0.4); }
    </style>
</head>
<body>
    <div class="background-visuals"><div class="tech-grid"></div></div>

    <header>
        <a href="home.html" class="Logo">
            <img src="img/HLogo.png" alt="Logo AgendaCar" onerror="this.style.display = 'none'" />
        </a>
        <button class="btn-header">Entrar / Cadastrar</button>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="menu-services">
                <button class="service-btn" data-categoria="Mecânica Geral"><i class="fa-solid fa-wrench"></i> Mecânica Geral</button>
                <button class="service-btn" data-categoria="Motores"><i class="fa-solid fa-cogs"></i> Motores</button>
                <button class="service-btn" data-categoria="Suspensão"><i class="fa-solid fa-car-burst"></i> Suspensão</button>
                <button class="service-btn" data-categoria="Lanternagem/Pintura"><i class="fa-solid fa-spray-can"></i> Lanternagem/Pintura</button>
                <button class="service-btn" data-categoria="Outros Serviços"><i class="fa-solid fa-toolbox"></i> Outros serviços</button>
                <button class="service-btn" id="btn-gerenciar-perfil" style="display: none" onclick="window.location.href = 'gerenciamento-perfil.html'">
                    <i class="fa-solid fa-user-gear"></i> Gerenciar Perfil
                </button>
            </div>

            <div class="institucional">
                <h3>Institucional</h3>
                <ul>
                    <li><a href="quem-somos.html">Quem somos?</a></li>
                    <li><a href="fale-conosco.html">Fale conosco</a></li>
                    <li><a href="termos-uso.html">Termos de Uso</a></li>
                    <li><a href="politica-privacidade.html">Política de Privacidade</a></li>
                </ul>
            </div>
        </aside>

        <main class="content">
            <h1>Solicitação de Orçamento</h1>
            <div class="content-body">
                <div class="card-prestador-container">
                    <div class="card-prestador">
                        <h3></h3>
                        <span></span>
                        <p></p>
                        <img src="img/Design/placeholder.png" alt="Imagem prestador" onerror="this.style.display='none'" />
                    </div>
                </div>
                <form class="form-orcamento">
                    <div class="form-input">
                        <label class="label-orcamento">Descreva o serviço que deseja solicitar orçamento.</label>
                        <input class="texto-orcamento" id="campoServico" placeholder="Ex: Motor fazendo barulho estranho" required />
                    </div>
                    <div class="form-input">
                        <label class="label-orcamento">Até quanto você pretende gastar com este serviço?</label>
                        <input class="texto-orcamento" id="campoValor" placeholder="R$ 0,00" inputmode="numeric" required />
                    </div>
                    <div class="form-input">
                        <label class="label-orcamento">Qual forma de pagamento você pretende utilizar?</label>
                        <input class="texto-orcamento" id="campoPagamento" placeholder="Ex: Cartão de Crédito" required />
                    </div>
                    <div class="form-input">
                        <label class="label-orcamento">Quando gostaria de iniciar o serviço?</label>
                        <input class="texto-orcamento" id="campoData" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10" required />
                    </div>
                    <div class="form-input">
                        <label class="label-orcamento">Observações</label>
                        <textarea rows="4" class="texto-orcamento" placeholder="Observações adicionais (opcional)"></textarea>
                    </div>
                    <div style="margin-top: 10px;">
                        <input type="checkbox" id="whatsappCheck" />
                        <label for="whatsappCheck" style="font-size: 14px; font-weight: 500;"> Gostaria de receber o orçamento pelo Whatsapp.</label>
                    </div>
                    <div class="botao-solicitar">
                        <button type="submit">Solicitar orçamento</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-youtube"></i>
    </footer>

    <div class="logout-modal-overlay" id="logoutModal">
        <div class="logout-modal">
            <i class="fa-solid fa-person-walking-arrow-right icon-alert"></i>
            <h3>Já vai embora?</h3>
            <p>Tem certeza que deseja sair da sua conta?</p>
            <div class="logout-buttons">
                <button class="btn-cancel" onclick="hideLogoutModal()">Cancelar</button>
                <button class="btn-confirm" onclick="confirmLogout()">Sim, sair</button>
            </div>
        </div>
    </div>

    <div class="confirm-modal-overlay" id="confirmModal">
        <div class="confirm-modal">
            <i class="fa-solid fa-circle-check" style="font-size: 48px; color: #16a34a; margin-bottom: 12px" id="confirmIcon"></i>
            <h3 id="confirmTitle"></h3>
            <p id="confirmText"></p>
            <div class="logout-buttons" style="margin-top: 18px;">
                <button class="btn-cancel" onclick="hideConfirmModal()">Fechar</button>
                <button class="btn-confirm" onclick="window.location.href='home.html'">Ir para Painel</button>
            </div>
        </div>
    </div>

    <div class="confirm-modal-overlay" id="leaveModal">
        <div class="confirm-modal">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 48px; color: #f47120; margin-bottom: 12px"></i>
            <h3 style="color: #0b4d8f">Cancelar orçamento?</h3>
            <p style="color: #374151">Todo o seu progresso atual será perdido. Tem certeza que deseja sair desta página?</p>
            <div class="logout-buttons" style="margin-top: 18px;">
                <button class="btn-cancel" onclick="hideLeaveModal()">Não</button>
                <button class="btn-confirm" id="btnConfirmLeave">Sim</button>
            </div>
        </div>
    </div>

    <!-- Scripts (ordem correta: prestadores antes do global) -->
    <script src="prestadores.js"></script>
    <script src="global.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            initLeaveModalBehavior();
            initSubmitFormBehavior();
            initMascaras();
            carregarPrestador();
        });

        // ================= SAÍDA SEGURA =================
        let urlDestino = "";
        function initLeaveModalBehavior() {
            const links = document.querySelectorAll(".service-btn, .Logo");
            links.forEach(function (link) {
                link.addEventListener("click", function (e) {
                    if (this.id === 'btn-gerenciar-perfil') return;
                    e.preventDefault();
                    if (this.classList.contains('service-btn')) {
                        const categoria = this.getAttribute("data-categoria");
                        urlDestino = "catalogo-prestadores.html?categoria=" + encodeURIComponent(categoria);
                    } else {
                        urlDestino = this.getAttribute("href");
                    }
                    document.getElementById("leaveModal").classList.add("active");
                });
            });

            document.getElementById("btnConfirmLeave").addEventListener("click", function () {
                if (urlDestino) window.location.href = urlDestino;
            });
        }

        function hideLeaveModal() {
            document.getElementById("leaveModal").classList.remove("active");
            urlDestino = "";
        }

        // ================= MÁSCARAS =================
        function initMascaras() {
            // Valor R$
            const valor = document.getElementById('campoValor');
            if (valor) {
                valor.addEventListener('input', function () {
                    let v = this.value.replace(/\D/g, '');
                    if (!v) { this.value = ''; return; }
                    v = (parseInt(v, 10) / 100).toFixed(2);
                    v = v.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                    this.value = 'R$ ' + v;
                });
            }
            // Data DD/MM/AAAA
            const data = document.getElementById('campoData');
            if (data) {
                data.addEventListener('input', function () {
                    let v = this.value.replace(/\D/g, '').slice(0, 8);
                    if (v.length >= 5) v = v.replace(/(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
                    else if (v.length >= 3) v = v.replace(/(\d{2})(\d{1,2})/, '$1/$2');
                    this.value = v;
                });
            }
        }

        // ================= FORMULÁRIO =================
        function initSubmitFormBehavior() {
            const form = document.querySelector(".form-orcamento");
            if (form) {
                form.addEventListener("submit", function (e) {
                    e.preventDefault();
                    showConfirmModal(
                        "Orçamento solicitado!",
                        "Seu pedido foi enviado com sucesso. O prestador entrará em contato em breve."
                    );
                    form.reset();
                });
            }
        }

        // ================= POPULAR PRESTADOR =================
        function carregarPrestador() {
            const prestadorId = new URLSearchParams(window.location.search).get("prestador");
            if (prestadorId && typeof getPrestadorById === 'function') {
                const prestador = getPrestadorById(prestadorId);
                if (prestador) {
                    document.querySelector(".card-prestador h3").textContent = prestador.nome;
                    document.querySelector(".card-prestador span").textContent = prestador.categoria;
                    document.querySelector(".card-prestador p").textContent = prestador.descricao;
                    if (prestador.imagemUrl) document.querySelector(".card-prestador img").src = prestador.imagemUrl;
                    return;
                }
            }
            document.querySelector(".card-prestador h3").textContent = "Prestador Selecionado";
            document.querySelector(".card-prestador span").textContent = "Mecânica Geral";
            document.querySelector(".card-prestador p").textContent = "Preencha os dados ao lado para solicitar o orçamento.";
        }
    </script>
</body>
</html>
